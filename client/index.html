<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Bug Investigator</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="workspace">
    <header class="topbar">
      <div class="topbar-title">
        <span class="topbar-dot"></span>
        <h1>AI Bug Investigator</h1>
      </div>
      <p class="subtitle">Paste an error. Understand it. Fix it.</p>
    </header>

    <main>
      <form id="analyzeForm">
        <label for="errorMessage">Error message / stack trace *</label>
        <textarea id="errorMessage" rows="5" required placeholder="Paste your error message or stack trace here..."></textarea>

        <label for="codeSnippet">Related code (optional)</label>
        <textarea id="codeSnippet" rows="5" placeholder="Paste the relevant code snippet, if you have one..."></textarea>

        <label for="language">Language</label>
        <select id="language">
          <option value="auto">Auto-detect</option>
          <option value="javascript">JavaScript</option>
          <option value="typescript">TypeScript</option>
          <option value="python">Python</option>
          <option value="java">Java</option>
          <option value="csharp">C#</option>
          <option value="cpp">C++</option>
          <option value="go">Go</option>
          <option value="php">PHP</option>
          <option value="ruby">Ruby</option>
          <option value="sql">SQL</option>
        </select>

        <button type="submit" id="submitBtn">
          <span id="submitBtnText">Investigate</span>
        </button>
      </form>

      <div id="errorBanner" class="error-banner" hidden></div>

      <section id="results" hidden>
        <div class="results-header">
          <span id="severityBadge" class="severity-badge"></span>
          <span id="confidenceText"></span>
          <button id="newAnalysisBtn" type="button" class="btn-secondary">New Analysis</button>
        </div>

        <div class="card">
          <h3>Root Cause</h3>
          <p id="rootCause"></p>
        </div>

        <div class="card">
          <h3>Debugging Steps</h3>
          <ol id="debuggingSteps"></ol>
        </div>

        <div class="card">
          <h3>Suggested Fix</h3>
          <p id="fixExplanation"></p>
          <pre><code id="fixCode" class="hljs"></code></pre>
        </div>

        <div class="card">
          <h3>Prevention Tips</h3>
          <ul id="preventionTips"></ul>
        </div>

        <div class="card" id="resourcesCard">
          <h3>Related Resources</h3>
          <ul id="resources"></ul>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
